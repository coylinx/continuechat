# continuechat.coylin.com — ContinueChat product site (static, /var/www/continuechat.coylin.com, deployed by site/deploy.sh).
# DNS-only (grey cloud) A record → this server; certificate renewed by certbot webroot (cert-name: continuechat.coylin.com).

server {
    listen 80;
    listen [::]:80;
    server_name continuechat.coylin.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name continuechat.coylin.com;

    root /var/www/continuechat.coylin.com;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/continuechat.coylin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/continuechat.coylin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # /privacy → privacy.html, /terms → terms.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
