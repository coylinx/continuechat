<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ContinueChat dev</title>
<style>
:root{--bg:#fff;--side:#f9f9f9;--fg:#0d0d0d;--mut:#6b6b6b;--line:#e5e5e5;--bubble:#f4f4f4}
html.dark{--bg:#212121;--side:#171717;--fg:#ececec;--mut:#9a9a9a;--line:#333;--bubble:#303030}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.shell{display:flex;height:100vh}.side{width:260px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.side[hidden]{display:none}.side>aside{display:flex;flex-direction:column;min-height:0;flex:1}.sidehead{padding:12px 14px;font-weight:600}
#list{flex:1;overflow:auto;padding:0 8px 12px}#list a{display:block;padding:6px 8px;border-radius:8px;color:inherit;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#list a:hover,#list a.on{background:#0000000f}html.dark #list a:hover,html.dark #list a.on{background:#ffffff14}
main{flex:1;display:flex;flex-direction:column;min-width:0}.top{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.top button,.top a{font:inherit;font-size:12px;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;text-decoration:none}
.top .site{font-weight:600;margin-right:auto}.chat{flex:1;overflow:auto;padding:20px max(16px,calc(50% - 360px))}
.msg{margin:10px 0;white-space:pre-wrap;word-break:break-word}.msg.user{background:var(--bubble);padding:10px 14px;border-radius:16px;margin-left:20%}
.empty{color:var(--mut);text-align:center;margin-top:20vh}
.composer{display:flex;gap:8px;align-items:flex-end;margin:0 max(16px,calc(50% - 360px)) 16px;border:1px solid var(--line);border-radius:22px;padding:10px 12px}
.ProseMirror{flex:1;min-height:24px;max-height:40vh;overflow:auto;outline:none;white-space:pre-wrap;word-break:break-word}
.ProseMirror:empty:before{content:attr(data-placeholder);color:var(--mut)}
.composer button{border:none;border-radius:999px;padding:6px 14px;background:var(--fg);color:var(--bg);font:inherit;cursor:pointer}.composer button:disabled{opacity:.3;cursor:default}
.showcase .top{display:none}
.log{font-size:12px;color:var(--mut);margin:0 max(16px,calc(50% - 360px)) 8px}
</style></head>
<body><script type="module" src="/dev/site.ts"></script></body></html>
